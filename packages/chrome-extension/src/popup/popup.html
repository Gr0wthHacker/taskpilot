<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskPilot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0f172a;
        --muted: #475569;
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --accent: #0f766e;
        --green: #16a34a;
        --yellow: #eab308;
        --red: #dc2626;
        --grey: #94a3b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --bg: #0f172a;
          --card: #1e293b;
          --border: #334155;
          --accent: #2dd4bf;
        }
      }
      body {
        width: 360px;
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        font-weight: 700;
        font-size: 14px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        border: 1px solid var(--border);
        background: var(--card);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--grey);
      }
      .dot.green { background: var(--green); }
      .dot.yellow { background: var(--yellow); }
      .dot.red { background: var(--red); }
      .dot.grey { background: var(--grey); }
      .actions {
        display: flex;
        gap: 8px;
        padding: 12px 14px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-weight: 600;
        flex: 1;
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
      }
      .recent {
        padding: 4px 14px 12px;
        max-height: 320px;
        overflow-y: auto;
      }
      .recent h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 8px 0;
      }
      .entry {
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 4px;
        font-size: 12px;
        background: var(--card);
        border: 1px solid var(--border);
      }
      .entry .url {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .entry .title {
        font-weight: 600;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .entry .ts {
        color: var(--muted);
        font-size: 10px;
        margin-top: 4px;
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 12px 0;
        text-align: center;
      }
      footer {
        padding: 8px 14px 12px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <span class="title">TaskPilot</span>
      <span class="pill"><span id="status-dot" class="dot grey"></span><span id="status-text">unknown</span></span>
    </header>

    <div class="actions">
      <button id="capture-now">Capture this page now</button>
      <button id="open-options" class="secondary">Options</button>
    </div>

    <section class="recent">
      <h2>Recent captures</h2>
      <div id="entries"></div>
    </section>

    <footer>
      <span id="pending">0 pending</span>
      <a href="#" id="open-options-link">Settings</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
