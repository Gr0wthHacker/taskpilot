<!doctype html>
<!--
  The `dark` class is NOT hardcoded here — `src/renderer/main.tsx` runs
  `applyStoredTheme()` before React mounts and toggles the class based on
  the persisted `theme` setting (defaulting to "system", which reads
  `prefers-color-scheme`). Keeping the initial class empty means a fresh
  install paints in light mode for users on a light-mode OS rather than
  flashing dark first.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'self' http://localhost:7847 ws://localhost:5173 http://localhost:5173;" />
    <title>TaskPilot</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
